# PyAppify 配置文件 - MediaSpider
name: "MediaSpider"
description: "道路塌陷爬虫系统 - 微信公众号、微博、RSS 采集和 AI 总结"
# icon: "icons/icon.ico"  # 已删除 icons 文件夹，暂时注释

profiles:
  - name: "release"
    # MediaSpider 的 Git 仓库地址
    git_url: "https://github.com/Anpromole/MediaSpider.git"
    # 入口文件
    main_script: "main.py"
    # Python 版本需求
    requires_python: "3.10"
    # 依赖文件
    requirements: "requirements.txt"
