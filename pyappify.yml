name: "MediaSpider" # 应用程序名称
profiles:
  - name: "release"
    # MediaSpider 的 Git 仓库地址
    git_url: "https://github.com/Anpromole/MediaSpider.git" 
    # 入口文件
    main_script: "main.py" 
    # Python 版本需求
    requires_python: "3.10" 
    # 依赖文件
    requirements: "requirements.txt"
    # 如果在国内使用，建议添加镜像源加速依赖安装
    pip_args: "--index-url https://pypi.tuna.tsinghua.edu.cn/simple"