# MediaSpider - PyAppify 自动打包工作流
name: Build PyAppify Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 下载 pyappify 启动器
        run: |
          curl -L https://github.com/ok-oldking/pyappify/releases/latest/download/pyappify.exe -o pyappify.exe

      - name: 语法检查
        run: |
          python -m py_compile main.py config.py threads.py widgets.py
          Write-Host "Python 语法检查通过"

      - name: 创建发布包
        run: |
          Compress-Archive -Path @("pyappify.exe","pyappify.yml","icons","requirements.txt","main.py","config.py","threads.py","widgets.py","spider") -DestinationPath "MediaSpider-${{ github.ref_name }}-windows.zip"

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          files: MediaSpider-${{ github.ref_name }}-windows.zip
          generate_release_notes: true

  build-macos:
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements-macos.txt

      - name: 下载 pyappify 启动器
        run: |
          curl -L https://github.com/ok-oldking/pyappify/releases/latest/download/pyappify-macos -o pyappify
          chmod +x pyappify

      - name: 语法检查
        run: |
          python -m py_compile main.py config.py threads.py widgets.py
          echo "Python 语法检查通过"

      - name: 创建发布包
        run: |
          zip -r "MediaSpider-${{ github.ref_name }}-macos.zip" pyappify pyappify.yml icons requirements.txt main.py config.py threads.py widgets.py spider

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          files: MediaSpider-${{ github.ref_name }}-macos.zip
