# MediaSpider - PyAppify 自动打包工作流
name: Build PyAppify Package

on:
  push:
    tags:
      - 'v*'  # 当推送版本标签时触发，如 v1.0.0
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os_name: windows
            runner: windows-latest
            launcher: pyappify.exe
            archive_name: MediaSpider-${{ github.ref_name }}-windows.zip
          - platform: macos-latest
            os_name: macos
            runner: macos-latest
            launcher: pyappify
            archive_name: MediaSpider-${{ github.ref_name }}-macos.zip

    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖（仅检查）
        run: |
          pip install -r requirements.txt
        shell: bash

      - name: 下载 pyappify 启动器
        run: |
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            curl -L https://github.com/ok-oldking/pyappify/releases/latest/download/pyappify.exe -o pyappify.exe
          else
            curl -L https://github.com/ok-oldking/pyappify/releases/latest/download/pyappify-macos -o pyappify
            chmod +x pyappify
          fi
        shell: bash

      - name: 语法检查
        run: |
          python -m py_compile main.py config.py threads.py widgets.py
          echo "Python 语法检查通过"
        shell: bash

      - name: 创建发布包
        run: |
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            Compress-Archive -Path @("pyappify.exe","pyappify.yml","icons","requirements.txt","main.py","config.py","threads.py","widgets.py","spider") -DestinationPath "${{ matrix.archive_name }}"
          else
            zip -r "${{ matrix.archive_name }}" pyappify pyappify.yml icons requirements.txt main.py config.py threads.py widgets.py spider
          fi
        shell: bash

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          generate_release_notes: true
