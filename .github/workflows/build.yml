name: Build MediaSpider
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    # 【关键修复 1】：赋予 GitHub Actions 创建 Release 和上传文件的写权限
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with PyAppify
        uses: ok-oldking/pyappify-action@v1
        with:
          config: pyappify.yml

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          # 【关键修复 2】：扩大匹配范围。如果不知道确切名字，可以直接匹配所有生成的 zip 文件
          # 如果之前作者的 action 输出在特定目录，你可能需要写成 release/*.zip 或类似的路径
          files: |
            *.zip 
            */*.zip
